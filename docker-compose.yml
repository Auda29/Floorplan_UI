services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: floorplan-ui-ha
    restart: unless-stopped
    privileged: true
    ports:
      - "8124:8123"
    volumes:
      # HA config directory
      - ./ha_config:/config
      # Mount custom component for development
      - ./custom_components:/config/custom_components
    environment:
      - TZ=Europe/Berlin
