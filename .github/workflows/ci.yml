name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify generated configuration types
        working-directory: frontend
        run: |
          pnpm schema:generate
          git diff --exit-code -- src/types/floorplan-config.generated.ts
      - name: Format
        working-directory: frontend
        run: pnpm format:check
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit and component tests
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        run: pnpm build
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/floorplan_ui/frontend/floorplan-ui.js
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Production bundle browser smoke
        working-directory: frontend
        run: pnpm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check custom_components/floorplan_ui tests tests_ha
      - name: Ruff format
        run: ruff format --check custom_components/floorplan_ui tests tests_ha
      - name: Mypy
        run: mypy custom_components/floorplan_ui
      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report
          coverage xml
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: error
      - name: Compile Python sources
        run: python -m compileall -q custom_components/floorplan_ui

  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python-version: "3.13"
            packages: >-
              homeassistant==2025.7.3
              home-assistant-frontend==20250702.3
              pytest-homeassistant-custom-component==0.13.263
              pycares==4.11.0
          - name: current
            python-version: "3.14"
            packages: >-
              homeassistant
              home-assistant-frontend
              pytest-homeassistant-custom-component
    name: Home Assistant (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Home Assistant test dependencies
        run: >-
          python -m pip install
          pytest
          pytest-asyncio
          ${{ matrix.packages }}
      - name: Integration tests with coverage
        run: |
          python -m pytest -q -o asyncio_mode=auto \
            --cov=custom_components/floorplan_ui \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-ha-${{ matrix.name }}.xml \
            --cov-fail-under=40 \
            tests_ha
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ha-${{ matrix.name }}
          path: coverage-ha-${{ matrix.name }}.xml
          if-no-files-found: error

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
