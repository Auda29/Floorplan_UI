[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["custom_components/floorplan_ui/frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["custom_components/floorplan_ui"]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
